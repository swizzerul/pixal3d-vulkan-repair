name: Experimental Windows Vulkan bundles
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Remaining authorized run limit (maximum 60, aggregate 180)
        required: true
        default: '60'
        type: string
permissions:
  contents: write
concurrency:
  group: bounded-repair-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'swizzerul/pixal3d-vulkan-repair' && github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: ${{ fromJSON(inputs.minutes) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check bounds and fetch exact public tools commit
        run: |
          $ErrorActionPreference = 'Stop'
          $minutes = [int]'${{ inputs.minutes }}'
          if ($minutes -lt 1 -or $minutes -gt 60) { throw 'Invalid bounded timeout' }
          git init .
          if ($LASTEXITCODE) { throw 'git init failed' }
          git config core.autocrlf false
          git remote add origin https://github.com/swizzerul/pixal3d-vulkan-repair.git
          git -c credential.helper= fetch --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'exact tools fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -or (git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'tools commit mismatch' }
      - name: Acquire pinned public dependencies and build complete candidate
        run: ./scripts/build.ps1
      - name: Publish compact experimental bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish.ps1
